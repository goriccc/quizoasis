name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  typecheck:
    name: Typecheck (tsc)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      # Separated from next build so Vercel OOM and typecheck don't share a machine
      - run: npx tsc --noEmit
        env:
          NODE_OPTIONS: --max-old-space-size=6144

  budgets:
    name: Build budgets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/check-build-budgets.mjs

  formats:
    name: Validate test formats
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run validate:formats
